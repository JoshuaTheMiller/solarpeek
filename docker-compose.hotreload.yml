services:
  backend:
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle

  frontend:
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  bundle_cache:
