# ─────────────────────────────────────────────────────────────────────────────
# SolarPeak — Dev Container Compose Override
#
# Extends docker-compose.yml.  Adds the `devcontainer` workspace service that
# VS Code / JetBrains attach to.  PostgreSQL and Redis are inherited from the
# base compose file unchanged.
#
# Volume strategy
#   bundle_cache   — Bundler gem cache; survives container rebuilds
#   node_modules   — npm packages; kept inside the container so the host bind-
#                    mount does not shadow them (avoids native-module mismatches)
# ─────────────────────────────────────────────────────────────────────────────

services:

  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      # Source tree (writable — you edit here)
      - ..:/workspaces/SolarPeak:cached
      # Gem cache survives rebuilds
      - bundle_cache:/usr/local/bundle
      # node_modules lives inside the container, not on the host bind-mount
      - node_modules:/workspaces/SolarPeak/frontend/node_modules
    command: sleep infinity   # keeps the container alive; VS Code attaches to it
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Pre-wire infrastructure URLs so the app can start without manual .env editing.
      # These are overridden by values in backend/.env / frontend/.env.local once
      # post-create.sh writes those files.
      DATABASE_URL: postgresql://solarpeak:solarpeak@postgres/solarpeak_development
      REDIS_URL:    redis://redis:6379/0
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:3001

volumes:
  bundle_cache:
  node_modules:
