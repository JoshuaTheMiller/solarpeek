<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SolarPeak API — Documentation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      /* Custom top banner above Redoc */
      #header {
        background: #1a1a2e;
        color: #fff;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }

      #header .logo {
        font-size: 1.2rem;
        font-weight: 800;
        color: #F59E0B;
        letter-spacing: -0.02em;
      }

      #header .badge {
        background: #F59E0B;
        color: #1a1a2e;
        font-size: 0.65rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 99px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      #header .spacer { flex: 1; }

      #header a {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.82rem;
        transition: color 0.15s;
      }
      #header a:hover { color: #F59E0B; }
    </style>
  </head>

  <body>
    <!-- ── Top bar ──────────────────────────────────────────────────────── -->
    <div id="header">
      <span class="logo">☀ SolarPeak</span>
      <span class="badge">API v1</span>
      <span class="spacer"></span>
      <a href="/openapi/v1/swagger.json" target="_blank">OpenAPI JSON ↗</a>
    </div>

    <!-- ── Redocly embed ────────────────────────────────────────────────── -->
    <redoc
      spec-url="/openapi/v1/swagger.json"
      expand-responses="200,201"
      hide-download-button="false"
      theme='{
        "colors": {
          "primary": { "main": "#F59E0B" },
          "http": {
            "get":    "#0EA5E9",
            "post":   "#22C55E",
            "patch":  "#F59E0B",
            "delete": "#EF4444"
          }
        },
        "typography": {
          "fontSize":       "15px",
          "fontFamily":     "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
          "headings": {
            "fontFamily":   "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
            "fontWeight":   "700"
          },
          "code": {
            "fontSize":     "13px",
            "fontFamily":   "\"SFMono-Regular\", Consolas, \"Liberation Mono\", Menlo, monospace"
          }
        },
        "sidebar": {
          "width":          "280px",
          "backgroundColor":"#0f172a",
          "textColor":      "#cbd5e1"
        },
        "rightPanel": {
          "backgroundColor":"#1e293b"
        }
      }'
    ></redoc>

    <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js"></script>
  </body>
</html>
